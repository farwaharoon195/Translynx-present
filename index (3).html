
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.stage{width:100%;background:#f7f5ff;border-radius:var(--border-radius-lg);overflow:hidden;min-height:440px;padding:2.5rem 2rem;display:flex;flex-direction:column;align-items:center;position:relative;}
.top-label{font-size:11px;color:#888780;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:1.5rem;text-align:center;}
.dot-map{width:100%;max-width:560px;height:200px;position:relative;margin:0 auto;}
.mdot{position:absolute;width:4px;height:4px;border-radius:50%;background:#AFA9EC;opacity:0;transition:opacity 0.3s;}
.mdot.on{opacity:0.7;}
.mdot.special{background:#534AB7;width:8px;height:8px;opacity:0;transition:opacity 0.5s;}
.mdot.special.on{opacity:1;}
.count-display{text-align:center;margin:1.25rem 0 0.5rem;}
.cnum{font-size:48px;font-weight:500;color:#534AB7;line-height:1;}
.clabel{font-size:13px;color:#888780;margin-top:4px;}
.message-area{text-align:center;min-height:60px;margin-top:1rem;}
.msg{font-size:17px;font-weight:500;color:#2C2C2A;opacity:0;transition:opacity 0.7s;position:absolute;width:100%;left:0;}
.msg.show{opacity:1;position:relative;}
.sub-msg{font-size:13px;color:#5F5E5A;margin-top:6px;opacity:0;transition:opacity 0.7s 0.4s;}
.sub-msg.show{opacity:1;}
.action-row{display:flex;gap:10px;margin-top:1.5rem;justify-content:center;opacity:0;transition:opacity 0.8s;flex-wrap:wrap;}
.action-row.show{opacity:1;}
.btn-p{padding:9px 20px;border-radius:var(--border-radius-md);background:#534AB7;border:none;color:#fff;font-size:13px;cursor:pointer;}
.btn-p:hover{background:#7F77DD;}
.btn-o{padding:9px 20px;border-radius:var(--border-radius-md);background:transparent;border:1px solid #AFA9EC;color:#534AB7;font-size:13px;cursor:pointer;}
.btn-o:hover{background:#EEEDFE;}
.highlight-punjab{position:absolute;border:1.5px solid #D85A30;border-radius:4px;opacity:0;transition:opacity 0.5s;}
</style>

<div class="stage">
  <div class="top-label">every dot is a person</div>
  <div class="dot-map" id="dmap">
    <div class="highlight-punjab" id="hpunjab" style="left:52%;top:20%;width:80px;height:70px;"></div>
  </div>
  <div class="count-display">
    <div class="cnum" id="cnum">0</div>
    <div class="clabel">Punjabi speakers in Pakistan</div>
  </div>
  <div class="message-area" id="msgarea">
    <div class="msg" id="m1">Each one tried to use a smartphone today.</div>
    <div class="sub-msg" id="s1">None of them found an app that spoke their language.</div>
  </div>
  <!-- <div class="action-row" id="arow">
    <button class="btn-p" onclick="sendPrompt('Write slide by slide spoken commentary for presenting the Translynx Gamma deck to an audience')">Present this deck ↗</button>
    <button class="btn-o" onclick="sendPrompt('Give me 3 powerful opening lines to say before showing the Translynx presentation')">More opening lines ↗</button>
  </div> -->
</div>

<script>
const map=document.getElementById('dmap');
const dots=[];
const total=180;
for(let i=0;i<total;i++){
  const d=document.createElement('div');
  d.className='mdot';
  d.style.left=(2+Math.random()*94)+'%';
  d.style.top=(2+Math.random()*90)+'%';
  map.appendChild(d);
  dots.push(d);
}
const special=document.createElement('div');
special.className='mdot special';
special.style.left='58%';
special.style.top='42%';
map.appendChild(special);

let shown=0;
let displayNum=0;
const targetNum=110000000;
const cnumEl=document.getElementById('cnum');

function formatNum(n){
  if(n>=1000000)return Math.round(n/1000000)+'M+';
  if(n>=1000)return Math.round(n/1000)+'K+';
  return n.toString();
}

let dotInterval=setInterval(()=>{
  if(shown<total){
    const batch=Math.ceil((shown+1)/20);
    for(let b=0;b<batch && shown<total;b++){
      dots[shown].classList.add('on');
      shown++;
    }
    displayNum=Math.round((shown/total)*targetNum);
    cnumEl.textContent=formatNum(displayNum);
  } else {
    clearInterval(dotInterval);
    cnumEl.textContent='110M+';
    special.classList.add('on');
    document.getElementById('hpunjab').style.opacity='0.6';
    setTimeout(()=>{
      document.getElementById('m1').classList.add('show');
      document.getElementById('s1').classList.add('show');
      setTimeout(()=>{ document.getElementById('arow').classList.add('show'); },1200);
    },600);
  }
},40);
</script>
